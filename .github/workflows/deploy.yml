name: Deploy Vault to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quartz holen
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v5

      - name: Vault als content/ einbinden
        uses: actions/checkout@v4
        with:
          path: content
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Config anlegen
        run: |
          cp quartz/cli/templates/obsidian.yaml quartz.config.yaml
          sed -i 's|^\(\s*baseUrl:\).*|\1 schule.tim-decker.dev|' quartz.config.yaml
          sed -i 's|^\(\s*locale:\).*|\1 de-DE|' quartz.config.yaml
          sed -i 's|^\(\s*pageTitle:\).*|\1 "Tims E-Portfolio"|' quartz.config.yaml

      - name: Sortierung nach Titel
        run: |
          cat > quartz.ts << 'EOF'
          import { loadQuartzConfig, loadQuartzLayout } from "./quartz/plugins/loader/config-loader"
          import { componentRegistry } from "./quartz/components/registry"

          const byTitle = (f1: any, f2: any) => (f1.frontmatter?.title ?? "").localeCompare(f2.frontmatter?.title ?? "", "de", { numeric: true })

          componentRegistry.setOptionOverrides("@quartz-community/tag-page", { sort: byTitle })
          componentRegistry.setOptionOverrides("@quartz-community/folder-page", { sort: byTitle })

          const config = await loadQuartzConfig()
          export default config
          export const layout = await loadQuartzLayout()
          EOF

      - run: npm ci
      - run: npx quartz plugin install --from-config
      - run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4